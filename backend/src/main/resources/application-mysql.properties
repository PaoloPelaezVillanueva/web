# =====================================================================
#  Perfil MYSQL (base de datos real y permanente)
#  Antes de arrancar, ejecuta database/01_esquema.sql en MySQL Workbench.
# =====================================================================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/crm_cobranzas?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:10}
spring.datasource.hikari.connection-timeout=20000

# El esquema lo crea database/01_esquema.sql: Hibernate no modifica tablas.
spring.jpa.hibernate.ddl-auto=none
