# =====================================================================
# Perfil MYSQL / MariaDB - base de datos real y permanente
# =====================================================================

spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# Pool de conexiones
# Configuración conservadora para hosting compartido / conexión remota.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:3}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:60000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:45000}

# El esquema se administra mediante database/01_esquema.sql.
spring.jpa.hibernate.ddl-auto=none