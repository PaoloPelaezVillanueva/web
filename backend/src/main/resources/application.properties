# =====================================================================
#  CRM de Cobranzas - ESCALL PERÚ S.A.C.  |  Configuración común
#  Los valores sensibles se leen de variables de entorno o del archivo
#  backend/.env (copia .env.example como .env y complétalo).
# =====================================================================
spring.application.name=crm-cobranzas
spring.config.import=optional:file:.env[.properties]

# Perfil por defecto: "mysql". Para probar sin base de datos usa el perfil "demo".
spring.profiles.default=mysql

server.port=${PORT:8080}
server.error.include-message=never

spring.jpa.open-in-view=false

# Fechas en formato ISO en la URL (ej: ?desde=2026-10-01)
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Integración de Datos: tamaño máximo de archivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Seguridad (JWT) ---
app.jwt.secreto=${JWT_SECRETO:cambia-este-secreto-por-uno-largo-y-aleatorio-123456}
app.jwt.horas-expiracion=${JWT_HORAS:8}

# --- Orígenes permitidos (dirección del frontend Angular), separados por coma ---
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

# --- Primer administrador (solo se crea si la tabla usuarios está vacía) ---
app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# --- true = crea equipo, clientes y gestiones de ejemplo si no hay clientes ---
app.datos-demo=${DATOS_DEMO:true}

# --- Zona horaria de la operación (fechas de gestiones y reportes) ---
app.zona-horaria=${ZONA_HORARIA:America/Lima}

management.endpoints.web.exposure.include=health
