# =====================================================================
#  Perfil DEMO: base de datos H2 en memoria (no necesita MySQL).
#  Ideal para probar o presentar. Los datos se pierden al apagar.
#  Consola web de la BD: http://localhost:8080/h2-console
#    JDBC URL: jdbc:h2:mem:crm   usuario: sa   (sin contraseña)
# =====================================================================
spring.datasource.url=jdbc:h2:mem:crm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
