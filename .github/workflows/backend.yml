name: Verificar backend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Pruebas de la API
        working-directory: backend
        run: sh ./mvnw -B verify
      - name: Construir imagen
        run: docker build -t crm-cobranzas:ci backend
      - name: Comprobar arranque y autenticación con MySQL
        run: bash backend/scripts/verificar-contenedor.sh
